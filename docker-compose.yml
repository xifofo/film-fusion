services:
  film-fusion:
    build:
      context: .
    image: "kumayi/film-fusion:v2.0.1"
    container_name: "film-fusion"
    restart: unless-stopped
    ports:
      # Web 管理界面和 API 端口
      - "9000:9000"
      # Emby 代理端口（用于直链播放）
      - "8097:8097"
    volumes:
      # 配置和数据目录
      - ./data:/app/data
      # 下载目录（可选，如果需要容器访问本地下载文件）
      # - /path/to/downloads:/mnt/downloads
      # CloudDrive2挂载目录（可选）
      # - /mnt/clouddrive:/mnt/clouddrive:ro
    environment:
      # 设置时区
      - TZ=Asia/Shanghai
      # 运行模式（生产环境）
      - GIN_MODE=release
      # RSS 生成器执行面只通过 Compose 内网访问。
      - RSS_GENERATOR_WORKER_URL=http://rss-generator-worker:8787
      - RSS_GENERATOR_WORKER_TOKEN=${RSS_GENERATOR_WORKER_TOKEN:?set RSS_GENERATOR_WORKER_TOKEN in .env}
      - RSS_GENERATOR_PUBLIC_BASE_URL=${RSS_GENERATOR_PUBLIC_BASE_URL:-}
    depends_on:
      rss-generator-worker:
        condition: service_healthy
    # 网络配置（可选）
    # networks:
    #   - film-fusion-network

  rss-generator-worker:
    build:
      context: ./rss-generator-worker
    image: "film-fusion-rss-generator-worker:local"
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - WORKER_AUTH_TOKEN=${RSS_GENERATOR_WORKER_TOKEN:?set RSS_GENERATOR_WORKER_TOKEN in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

# 网络配置（可选）
networks:
  default:
    name: film-fusion-network
