services:
  film-fusion:
    image: "kumayi/film-fusion:v3.0.8"
    container_name: "film-fusion"
    # restart: unless-stopped
    ports:
      # Web 管理界面和 API 端口
      - "8095:8095"
      # Emby 代理端口（用于直链播放）
      - "8097:8097"
    volumes:
      # 配置和数据目录
      - /vol3/1000/Docker/FilmFusion/data:/app/data
      # 媒体目录
      - /vol3/1000/MediaSTRM:/MediaSTRM
      - /vol1/1000/CloudNAS:/CloudNAS
      - /vol2/1000/Media:/Media
      - /vol2/1000/Media:/vol2/1000/Media
      - /vol1/1000/CloudNAS:/vol1/1000/CloudNAS
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
      # RSS Worker 只通过 Docker 内部网络访问。
      - RSS_GENERATOR_WORKER_URL=http://rss-generator-worker:8787
    depends_on:
      rss-generator-worker:
        condition: service_healthy

  rss-generator-worker:
    image: "kumayi/film-fusion-rss-generator-worker:v3.0.8"
    container_name: "rss-generator-worker"
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    environment:
      - NODE_ENV=production
      - PORT=8787
      # 必填：至少 32 个字符，并与 FilmFusion「系统设置 → RSS 生成器」中填写的值完全相同。
      - WORKER_AUTH_TOKEN=
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(async r=>{const body=await r.json();if(!r.ok||body.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

networks:
  default:
    name: film-fusion-network
