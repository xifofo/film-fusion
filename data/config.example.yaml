server:
  port: 9000
  username: "admin"
  password: ""
  download_115_concurrency: 1  # 115Open下载并发数
  cookie_115_default_app: "alipaymini" # 115 Cookie 自动续期默认设备端
  process_new_media: false     # 是否处理新增媒体事件（通过webhook）
  # FilmFusion 管理后台登录防爆破。直连时 trusted_proxy_cidrs 保持为空。
  security:
    enabled: true
    window_minutes: 10
    max_failures_per_account_ip: 5
    max_failures_per_ip: 20
    block_minutes: 30
    trusted_proxy_cidrs: []

# 登录页公开展示配置，保存后刷新页面即可生效。
site:
  login_title: "Film Fusion"
  login_subtitle: "Film Fusion 是简单的 Emby + 网盘的辅助工具"
  login_form_title: "欢迎回来"
  login_form_subtitle: "使用管理员账户进入 Film Fusion 控制台"
  login_background_url: ""     # 留空使用内置渐变背景，也可填写 HTTPS 图片地址
  login_background_source: "custom" # custom / emby / tmdb；动态来源不可用时回退到上面的图片
  login_background_mode: "latest"   # latest / popular
  login_background_interval: 12     # 多图轮播间隔（秒，5-300）
  login_background_limit: 10        # 动态背景数量（1-20）
  footer_text: "Powered by Kumayi"
  icp_number: ""               # 例如：京ICP备12345678号
  police_number: ""            # 例如：京公网安备 11000002000001号

# CloudDrive2 webhook 默认关闭。请生成独立随机 Token 后再开启；不要复用后台密码。
webhook:
  clouddrive2:
    enabled: false
    token: ""  # openssl rand -hex 32

telegram:
  enabled: false
  bot_token: ""              # 从 @BotFather 获取，后台读取时会脱敏
  chat_id: ""                # 群组/频道 ID，例如 -1001234567890
  message_thread_id: 0       # 论坛群话题 ID，0 表示不指定
  instance_name: "FilmFusion"
  api_base: "https://api.telegram.org"
  timeout_seconds: 10
  silent: false
  notify_emby_brute_force: true
  notify_system_brute_force: true

moviepilot:
  api: "http://127.0.0.1:3001"
  username: ""
  password: ""

hdhive:
  enabled: false
  base_url: "https://hdhive.com"
  client_id: ""       # HDHive OpenAPI 应用公开 ID，用于生成授权链接
  redirect_uri: ""    # OAuth 回调地址，必须与 HDHive 应用配置一致
  scope: "query unlock"
  api_key: ""         # HDHive OpenAPI 应用 Secret，用于 X-API-Key
  access_token: ""    # HDHive 用户 Access Token，用于查询/解锁资源
  refresh_token: ""   # 预留：用户 Refresh Token
  timeout_seconds: 30 # 请求超时时间

emby:
  enabled: true
  url: "http://127.0.0.1:8096"
  # Emby 代理端口
  run_proxy_port: 8097
  api_key: ""
  cache_time: 30 # 缓存直链时间，单位：分钟
  # EMBY 管理员用户 ID, add_next_media_info 为 false 时可不配置
  admin_user_id: ""
  # 开始播放时同步补充当前媒体的播放信息（提前预热直链/缓存），关闭可降低 Emby 压力
  add_current_media_info: true
  # 播放时提前获取下一集的媒体信息，提高播放速度，需要配置 admin_user_id
  add_next_media_info: true
  # 登录防爆破。trusted_proxy_cidrs 留空时只使用 TCP 来源 IP，不信任转发头。
  security:
    enabled: true
    window_minutes: 10
    max_failures_per_account_ip: 5
    max_failures_per_ip: 20
    block_minutes: 30
    trusted_proxy_cidrs: []
  # Emby 图片请求按展示场景限制尺寸与质量，保存后热生效
  image_optimization:
    enabled: false
    library_cover: { enabled: true, max_width: 676, max_height: 380, quality: 80 }
    poster: { enabled: true, max_width: 356, max_height: 534, quality: 80 }
    continue_backdrop: { enabled: true, max_width: 674, max_height: 380, quality: 70 }
    list_poster: { enabled: true, max_width: 160, max_height: 240, quality: 80 }
    detail_logo: { enabled: true, max_width: 600, max_height: 152, quality: 85 }
    detail_backdrop: { enabled: true, max_width: 1920, max_height: 1080, quality: 70 }
    other: { enabled: false, max_width: 0, max_height: 0, quality: 80 }
  # 媒体库封面生成器
  cover:
    enabled: false                   # 是否启用封面生成（启用后才接收 API 调用 / 定时任务）
    cron: ""                         # cron 表达式（如 "0 3 * * *" 每天 3 点）；为空则只支持手动触发
    width: 1920                      # 封面宽度
    height: 1080                     # 封面高度
    jpeg_quality: 88                 # JPEG 输出质量 1-100
    poster_count: 9                  # 拼接海报数量（最新 N 个 Item）
    font_cn: "data/assets/fonts/SourceHanSansCN-Bold.otf"   # 中文字体路径
    font_en: "data/assets/fonts/Inter-Bold.ttf"             # 英文字体路径

log:
  level: info           # debug, info, warn, error, fatal
  format: json          # json, text
  output: file          # stdout, file
  max_size: 100         # MB
  max_backups: 3
  max_age: 28           # days
  compress: true

jwt:
  expire_time: 240       # hours
  issuer: "film-fusion"
